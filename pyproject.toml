[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppq-extractor"
version = "0.1.0"
description = "Cambridge Past Paper Question (PPQ) extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ppq-queue = "tools.queue_manager:main"
ppq-render = "tools.pdf_to_images:main"
ppq-crop = "tools.crop_slices:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "9709",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/test_pdf_to_images.py" = ["W291"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
